name: ci

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install Qt (pick correct arch on Windows)
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || '' }}

      # Ensure Ninja exists (Linux/macOS)
      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Ensure MSVC toolchain is active on Windows
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Configure
      - name: Configure (CMake)
        run: cmake --preset ${{ runner.os == 'Windows' && 'windows-release' || 'release' }}

      # Build
      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake --build --preset release

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build --preset windows-release --config Release

      # Test
      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: ctest --preset release --output-on-failure

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: ctest --preset windows-release -C Release --output-on-failure
